name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Next.js build cần biến public; giá trị giả là đủ cho CI.
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  database:
    name: Prisma migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: novastore
          POSTGRES_PASSWORD: novastore
          POSTGRES_DB: novastore
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U novastore" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://novastore:novastore@localhost:5432/novastore?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate schema
        run: pnpm --filter @novastore/database validate
      - name: Apply migrations to a fresh database
        run: pnpm db:migrate
      - name: Seed
        run: pnpm db:seed
      - name: Append-only audit log is enforced
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "INSERT INTO audit_logs (action, target_type) VALUES ('ci.check', 'system');"
          if psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "DELETE FROM audit_logs;"; then
            echo "audit_logs DELETE should have failed" && exit 1
          fi
      - name: Unaccented search works
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -tAc "SELECT to_tsvector('simple', immutable_unaccent('Ghi chú')) @@ plainto_tsquery('simple', 'ghi chu');" | grep -q t
