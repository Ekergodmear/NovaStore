# Hạ tầng local cho phát triển. KHÔNG dùng cho production.
name: novastore

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: novastore
      POSTGRES_PASSWORD: novastore
      POSTGRES_DB: novastore
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U novastore -d novastore']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # Giả lập Cloudflare R2 (S3-compatible). MinIO đã ngừng phát hành image cộng đồng
  # nên dùng SeaweedFS; ứng dụng chỉ nói chuyện qua S3 API nên có thể thay thế tự do.
  s3:
    image: chrislusf/seaweedfs:3.99
    command: ['server', '-dir=/data', '-s3', '-s3.port=8333', '-s3.config=/etc/seaweedfs/s3.json']
    ports:
      - '127.0.0.1:8333:8333'
    volumes:
      - s3-data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

  # Tạo 3 bucket theo docs/APK_SECURITY_PIPELINE.md §5. Tất cả private.
  s3-init:
    image: amazon/aws-cli:2.38.0
    depends_on:
      - s3
    environment:
      AWS_ACCESS_KEY_ID: novastore
      AWS_SECRET_ACCESS_KEY: novastore-dev-secret
      AWS_DEFAULT_REGION: auto
    entrypoint: ['/bin/bash', '-c']
    command:
      - |
        S3="aws --endpoint-url http://s3:8333 s3"
        for i in $$(seq 1 30); do $$S3 ls >/dev/null 2>&1 && break; sleep 2; done
        for bucket in quarantine public-artifacts media; do
          $$S3 mb "s3://$$bucket" 2>/dev/null || echo "bucket $$bucket đã tồn tại"
        done
        $$S3 ls
    restart: 'no'

volumes:
  postgres-data:
  redis-data:
  s3-data:
